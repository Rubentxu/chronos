version = 1
updated = "2026-09-15"
active_gate = "REC-C0"

[policy]
allowed_statuses = ["verified", "partial", "gap", "planned", "blocked"]
verified_requires = ["evidence", "uat", "verify"]

[architecture]
# Transitional violations observed at the convergence baseline. The checker
# fails when a new forbidden edge appears AND when a removed edge remains in
# this baseline, forcing the debt inventory to shrink with the code.
known_dependency_violations = [
  "chronos-services->chronos-store",
  "chronos-services->chronos-ebpf",
  "chronos-services->chronos-native",
  "chronos-services->chronos-browser",
  "chronos-store->chronos-native",
]

[[requirement]]
id = "TRUTH-001"
title = "ExecutionLog is authoritative for every agentic session"
status = "partial"
owner_gate = "REC-C1"
notes = "chronos-log exists and native can dual-write, but EventBus-only and QueryEngine-authoritative paths remain."

[[requirement]]
id = "TRUTH-002"
title = "Agent-visible reads use authoritative EventSeq cursors"
status = "gap"
owner_gate = "REC-C1"
notes = "events_read currently accepts but does not apply its cursor to the query position."

[[requirement]]
id = "TRUTH-003"
title = "Completeness and gaps are evidence-derived"
status = "gap"
owner_gate = "REC-C1"
notes = "Public v2 reads can report complete without authoritative gap knowledge."

[[requirement]]
id = "LOG-001"
title = "Append-only monotonic EventSeq and independent consumers"
status = "verified"
owner_gate = "REC-C1"
evidence = ["crates/chronos-log", "crates/chronos-sandbox/tests/m1_acceptance.rs"]
uat = ["m1_01_execution_log_core_impl", "m1_04_execution_log_durable_cursors_and_decoders_impl"]
verify = "cargo test -p chronos-sandbox --test m1_acceptance -- --test-threads=1"

[[requirement]]
id = "LOG-002"
title = "Bounded evidence loss is represented as Gap"
status = "verified"
owner_gate = "REC-C1"
evidence = ["crates/chronos-log/tests/persistence.rs"]
uat = ["M1 persistence overflow-to-gap acceptance"]
verify = "cargo test -p chronos-log --tests -- --test-threads=1"

[[requirement]]
id = "LEGACY-001"
title = "No agent/query dependency on EventBus destructive reads"
status = "gap"
owner_gate = "REC-C2"

[[requirement]]
id = "LEGACY-002"
