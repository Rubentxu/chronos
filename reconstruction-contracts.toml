[[requirement]]
id = "TRUTH-001"
title = "ExecutionLog is authoritative for every agentic session"
status = "verified"
owner_gate = "REC-C1"
evidence = [
  "crates/chronos-services/src/projection.rs::build_engine",
  "crates/chronos-services/src/projection.rs::meta_is_full",
  "crates/chronos-mcp/src/server.rs::ensure_projection",
  "crates/chronos-mcp/src/server.rs::gate_projection_for_wire",
  "chronos-sandbox/tests/rec_c1_7_projection_restart_equivalence.rs",
  "chronos-sandbox/tests/rec_c1_7_uat_c1_01_two_consumers.rs",
  "crates/chronos-services/src/projection.rs::tests::build_engine_preserves_seq_event_id_timestamp_ns_as_independent_dimensions",
  # REC-C1.8 closeout evidence (literal 10k, producer advance, A resumes;
  # negative `complete` arm of UAT-REC-C1-03; 4-dim independence with the
  # new captured_at_unix_ns dimension; 3 black-box wire tests replacing
  # the deleted dual_truth RED tests):
  "chronos-sandbox/tests/rec_c1_8_uat_c1_01_exact.rs",
  "chronos-sandbox/tests/rec_c1_8_uat_c1_03_forced_gap.rs",
  "crates/chronos-log/tests/rec_c1_8_uat_c1_05_four_dim.rs",
  "chronos-sandbox/tests/rec_c1_8_dual_truth_closeout.rs",
  "crates/chronos-log/src/record.rs::ExecutionRecord::captured_at_unix_ns",
]
uat = [
  "UAT-REC-C1-01 two consumers, 10k durable records, producer advance (rec_c1_8_uat_c1_01_exact)",
  "UAT-REC-C1-02 restart equivalence (rec_c1_7_projection_restart_equivalence)",
  "UAT-REC-C1-03 forced gap -> gap_detected, never complete (rec_c1_8_uat_c1_03_forced_gap)",
  "UAT-REC-C1-05 four-dimension independence (rec_c1_8_uat_c1_05_four_dim)",
  "dual-truth closeout on the wire (rec_c1_8_dual_truth_closeout)",
]
notes = "REC-C1.7: QueryEngine is now a reconstructible projection of SessionExecutionLog. The canonical builder is chronos_services::projection::build_engine; events_log_read::decode and build_engine share the decoder so events_read and the projection cannot drift. execution_query / state_query / trace_slice call gate_projection_for_wire at the top of the MCP handler; queries against a Truncated or Empty projection are refused with rmcp::ErrorData. Restart equivalence proven on the wire by rec_c1_7_projection_restart_equivalence (engine rebuilt from the durable log on first query after restart). Two-consumer semantics (independent cursors, monotonic event_id growth) proven by rec_c1_7_uat_c1_01_two_consumers. Time-semantics independence (seq vs event_id vs timestamp_ns) proven by projection::tests::build_engine_preserves_seq_event_id_timestamp_ns_as_independent_dimensions. EventBus / drain_raw_events / fired_buffer / TripwireFired remain as legacy analytics paths owned by REC-C2 (not removed in this cycle).\nREC-C1.8 (Authoritative Evidence Handoff): closes the three acceptance discrepancies left open by C1.7. (a) dual_truth RED tests removed; replaced by 3 black-box wire tests in rec_c1_8_dual_truth_closeout.rs (wrapper rebuilds engine from log, late-append rebuild on fresh process, state_query gate). (b) UAT-REC-C1-01 literal 10k durable records + producer advance + A resumes proven by rec_c1_8_uat_c1_01_exact (the old test used 64 records with a >=10 floor). (c) UAT-REC-C1-03 negative `complete` arm proven by rec_c1_8_uat_c1_03_forced_gap::uat_rec_c1_03_clean_session_reports_complete_negative; positive forced-gap blocked on FIND-C1.8-01 (a documented chronos_log::segmented segment-header bookkeeping bug — out of scope for REC-C1; deferred to m1-*). (d) UAT-REC-C1-05 four-dim independence (seq, event_id, monotonic_ns, captured_at_unix_ns) proven by rec_c1_8_uat_c1_05_four_dim; the new captured_at_unix_ns dimension was added to ExecutionRecord and NewExecutionRecord with #[serde(default, skip_serializing_if = \"Option::is_none\")] and does NOT promote v1->v2 (schema_version unchanged unless M2+ fields are populated)."
verify = "cargo test -p chronos-services --lib projection::; cargo test -p chronos-sandbox --test rec_c1_7_projection_restart_equivalence --test rec_c1_7_uat_c1_01_two_consumers -- --test-threads=1; cargo test -p chronos-sandbox --test rec_c1_8_uat_c1_01_exact --test rec_c1_8_dual_truth_closeout --test rec_c1_8_uat_c1_03_forced_gap -- --test-threads=1; cargo test -p chronos-log --test rec_c1_8_uat_c1_05_four_dim"

