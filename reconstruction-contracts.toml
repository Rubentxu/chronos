[baseline_scope.mandatory]
description = "Required GREEN before REC-C0 remote closure. Each workflow must report success on the merge candidate."
workflows = ["Architecture Contracts", "CI", "Coverage", "Vault Drift Sweep"]

[baseline_scope.privileged]
description = "Requires CHRONOS_PRIVILEGED_UAT=1 (or kernel ptrace perms) to exercise. Sandbox CI does NOT run these; they live in bucket D."
