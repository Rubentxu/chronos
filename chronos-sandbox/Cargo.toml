[package]
name = "chronos-sandbox"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rmcp = { version = "1.5", features = ["server", "macros", "schemars", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
chronos-domain = { path = "../crates/chronos-domain" }
chronos-capture = { path = "../crates/chronos-capture" }
chronos-query = { path = "../crates/chronos-query" }

[dev-dependencies]
chronos-mcp = { path = "../crates/chronos-mcp" }
chronos-python = { path = "../crates/chronos-python" }
chronos-java = { path = "../crates/chronos-java" }
chronos-go = { path = "../crates/chronos-go" }
chronos-browser = { path = "../crates/chronos-browser" }
