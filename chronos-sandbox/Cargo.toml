[package]
name = "chronos-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rmcp = { version = "1.5", features = ["server", "macros", "schemars", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
chronos-domain = { path = "../crates/chronos-domain" }
chronos-capture = { path = "../crates/chronos-capture" }
chronos-query = { path = "../crates/chronos-query" }

[dev-dependencies]
chronos-mcp = { path = "../crates/chronos-mcp" }
chronos-python = { path = "../crates/chronos-python" }
chronos-java = { path = "../crates/chronos-java" }
chronos-go = { path = "../crates/chronos-go" }
chronos-browser = { path = "../crates/chronos-browser" }
chronos-log = { path = "../crates/chronos-log" }
# m1-03: sandbox UAT exercises the producer-side migration in
# chronos-native (probe_backend → ExecutionLog).
chronos-native = { path = "../crates/chronos-native" }

[lints.rust]
# tarpaulin compiles the workspace with `--cfg=tarpaulin` (see
# scripts/run_coverage.sh). Declaring it here lets tests branch on it
# (e.g. rec_c2_2_uat_c2 R10.2 environment-unobservable skip) without
# triggering the `unexpected_cfgs` lint.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }
