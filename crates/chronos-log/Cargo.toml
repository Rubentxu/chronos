[package]
name = "chronos-log"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Append-only execution log: one authoritative evidence stream with multi-consumer cursor reads, explicit gaps, and replay support. See docs/chronos-agentic-reconstruction/docs/specs/EXECUTION_LOG.md."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
blake3 = { version = "1.5" }
lz4_flex = { version = "0.11" }
hex = { version = "0.4" }
chronos-domain = { path = "../chronos-domain" }
uuid = { workspace = true }

[dev-dependencies]
