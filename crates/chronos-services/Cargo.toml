[package]
name = "chronos-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Exposes test-only constructors on `SessionExecutionLog` so that
# integration tests in downstream crates (`chronos-mcp/tests/*`,
# `chronos-sandbox/tests/*`) can build a fixture without going
# through the composition root. NEVER enable in production.
test-utils = []

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chronos-query = { workspace = true }
chronos-domain = { workspace = true }
chronos-index = { workspace = true }
chronos-log = { workspace = true }
proptest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
proptest = { workspace = true }
# CAP-GAP-CHRONOS-H1.5-REPLAY-BENCH closure (2026-09-22):
# ReplayService had no bench; this adds criterion for replay_bench.rs.
criterion = { version = "0.5", features = ["html_reports"] }
# chronos-log needed for SegmentedExecutionLog::replay() bench target.
chronos-log = { workspace = true }
# REC-C3.5-residual-inversion R.3: chronos-native is only consumed
# inside `#[cfg(test)]` blocks (stub_session in probe.rs + the
# SessionLifecycleTestInjector rig). Production code no longer names
# the concrete backend; it consumes `Arc<dyn NativeProbeController>`
# and `Arc<dyn NativeProbeControllerFactory>` ports from `chronos-domain`.
chronos-native = { workspace = true }
# REC-C3.5-residual-inversion R.5: chronos-store is only consumed
# inside `#[cfg(test)]` blocks (test rigs wire the redb-backed
# adapters: SessionStoreBackedSessionReader, Blake3DiffEngine,
# SessionStoreBackedSessionArchive, SessionStoreBackedLifecycleStore,
# SessionStoreBackedCounterexampleRepository). Production code
# consumes only chronos-domain ports.
chronos-store = { workspace = true }

[[bench]]
name = "replay_bench"
harness = false
