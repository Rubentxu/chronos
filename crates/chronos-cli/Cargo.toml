[package]
name = "chronos-cli"
version.workspace = true
edition.workspace = true
description = "Operator CLI for Chronos — replays persisted counterexample bundles (m8-04)."

[[bin]]
name = "chronos"
path = "src/main.rs"

[dependencies]
chronos-domain = { workspace = true }
chronos-query = { workspace = true }
chronos-store = { workspace = true }
chronos-services = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# No third-party CLI framework per B-decision B1 (no clap). Manual arg parsing
# keeps the binary small and dependency footprint light — the CLI only ships
# two subcommands in m8-04.
bincode = { workspace = true }
