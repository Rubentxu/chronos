name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release Binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build -p chronos-mcp --release --target ${{ matrix.target }}
      - name: Fail loud if binary was not produced
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/chronos-mcp"
          if [ ! -f "$BIN" ]; then
            echo "::error::chronos-mcp binary missing for ${{ matrix.target }} after a green build step."
            echo "::error::The build must not silently skip targets. Inspect the Build step above."
            exit 1
          fi
          echo "binary ok: $BIN ($(wc -c < "$BIN") bytes)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronos-mcp-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/chronos-mcp
