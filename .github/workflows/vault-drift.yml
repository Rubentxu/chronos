name: Vault Drift Sweep

on:
  # No `paths:` filter, deliberately.
  #
  # CC#4 records a SHA-256 of *source* files into the archive manifests, so
  # the commonest way to create drift is to edit one of those source files
  # in a commit that does not touch the vault. A `paths:` filter listing
  # only the vault artefacts and this script cannot see that commit, so the
  # sweep never runs, never fails, and reports nothing while the manifests
  # are stale. Measured: 49 distinct source files are hashed across the
  # manifests and none of them was covered by the old filter. That is not a
  # gate passing — it is a gate that is structurally unable to fire.
  #
  # Enumerating the hashed paths instead would only defer the bug: the next
  # manifest entry would silently reintroduce the gap. The check costs ~21s
  # (measured: check_vault_drift.sh 20.73s, validate_cycle_artifacts.py
  # 0.08s), so it runs unconditionally. A commit that changes a hashed file
  # must regenerate the manifests in the same commit; that is the canonical
  # ritual in scripts/regen_manifest_index_shas.py, and this makes CI
  # enforce it instead of leaving it to memory.
  push:
    branches: [main]
  pull_request:

jobs:
  vault-drift:
    name: Vault drift sweep (CC#48 meta-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The drift sweep's CC#3/CC#8/CC#42/CC#47 cross-checks validate
          # SHAs against `git cat-file -e`, requiring the SHAs to be
          # reachable in the checked-out tree. The default `fetch-depth: 1`
          # is incompatible with that specification and produces hundreds
          # of false-positive drift lines (CC#8 reported 491 drift lines on
          # PR #19 before this fix). Fetch the full history + tags.
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check for drift
        run: ./scripts/check_vault_drift.sh
      - name: Validate cycle-artifact completeness (rec-c0-* and new cycles)
        run: python3 ./scripts/validate_cycle_artifacts.py
