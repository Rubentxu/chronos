name: Sandbox Smoke Tests
on:
  push:
    paths:
      # chronos-sandbox is a top-level workspace member, NOT under crates/.
      # The old `crates/chronos-sandbox/**` filter matched no file in the
      # repository, so this workflow could never fire.
      - 'chronos-sandbox/**'
      - '.github/workflows/sandbox-smoke.yml'
  pull_request:
    paths:
      - 'chronos-sandbox/**'
      - '.github/workflows/sandbox-smoke.yml'

jobs:
  smoke:
    name: Sandbox smoke (no containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: chronos-sandbox
      - name: Build sandbox
        run: cargo build -p chronos-sandbox
      # These tests spawn the real chronos-mcp server binary, which lives in
      # crates/chronos-mcp and is therefore NOT built by `-p chronos-sandbox`.
      # ci.yml gets this for free from its `cargo build --workspace` step; this
      # workflow had no equivalent, so the server the tests talked to was not
      # guaranteed to match the revision under test. Build it explicitly.
      - name: Build MCP server binary (test dependency)
        run: cargo build --bin chronos-mcp
      # Same class of gap, second instance. `counterexample_tools` (ce12),
      # `execution_log_read_e2e` and `store_open_failure` all spawn the `chronos`
      # CLI, which lives in crates/chronos-cli (`[[bin]] name = "chronos"`) and
      # is therefore also not built by `-p chronos-sandbox`. In ci.yml the
      # `cargo build --workspace` step provides it; this workflow had no
      # equivalent, so ce12 failed here with
      #   failed to spawn chronos CLI at "chronos": No such file or directory
      # A gate that runs a test whose fixture it never built is not exercising
      # what it claims to. Build it explicitly, same as the server above.
      - name: Build chronos CLI binary (test dependency)
        run: cargo build --bin chronos
      - name: Clippy
        run: cargo clippy -p chronos-sandbox -- -D warnings
      - name: Smoke tests
        run: cargo test -p chronos-sandbox -- --test-threads=1
      - name: Build benchmarks
        run: cargo build -p chronos-sandbox --benches
