name: policy-guard

# GENERATED by git-policy-install on 2026-11-18 from the machine's git-control
# config. The `edited` event matters as much as `opened`: the squash message
# is built from the PR title and body at merge time, so a body edited after
# a green check re-runs this guard and re-blocks the merge.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the guard
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Validate the squash message and every commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORGEJO_URL: ${{ vars.FORGEJO_URL || '' }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || '' }}
        run: |
          bash .github/scripts/policy-guard.sh "${{ github.event.pull_request.number }}"
