# SDDK agent permission registry — default-deny.
# Agents absent from this file are denied all phases and capabilities.
# SDDK011 requires every agents/*.md file of the resolved framework
# (2.0.1) to be declared here. Only the release-path agent carries grants;
# all other framework agents are listed explicitly with empty grants so the
# policy remains closed-by-default.

agents:
  sddk-release:
    phases: [release]
    capabilities: [release, git.inspect, git.push, git.tag]
  sddk-apply: { phases: [], capabilities: [] }
